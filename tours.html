<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silk Road — Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--teal:#0088c2;--bright:#1aa64a;--sand:#e9f8f0;--clay:#d2262f;--cream:#fff;--line:#cfe3d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;} html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{margin:0;background:var(--cream);color:var(--ink);overflow-x:hidden;}
body{font-family:'Work Sans',sans-serif;line-height:1.5;}
h1,h2,h3{font-family:'Marcellus',serif;font-weight:400;margin:0;color:#000;}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px;padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right));}
a{text-decoration:none;color:inherit;} button{font-family:inherit;cursor:pointer;}
header{background:var(--teal);color:#fff;position:sticky;top:0;z-index:10;}
.header-row{display:flex;align-items:center;justify-content:space-between;padding:16px max(22px,env(safe-area-inset-left)) 16px max(22px,env(safe-area-inset-right));gap:12px;flex-wrap:wrap;}
.logo{font-family:'Marcellus',serif;font-size:1.25rem;color:#fff;}
nav.main-nav{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem;}
nav.main-nav a{color:#eaf6ff;}
nav.main-nav a.active{color:#fff;border-bottom:2px solid #fff;padding-bottom:3px;}
.lang-switch{display:flex;gap:4px;}
.lang-switch button{background:none;border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:4px;padding:5px 9px;font-size:.8rem;}
.lang-switch button.active{background:#fff;color:var(--teal);border-color:#fff;}
.page-hero{background:linear-gradient(160deg,#0099cc 0%,#1aa64a 130%);color:#fff;padding:40px 0;}
.page-hero h1{color:#fff;font-size:clamp(1.6rem,4vw,2.4rem);}
section{padding:40px 0;}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0;}
.filters button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font-size:.85rem;}
.filters button.active{background:#fff;color:var(--ink);border-color:var(--bright);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
.card{background:var(--sand);border-radius:6px;padding:20px;border:1px solid var(--line);}
.card h3{font-size:1.15rem;}
.card p{font-size:.9rem;color:#333;margin-top:8px;}
.card .price{display:inline-block;margin-top:10px;font-size:.78rem;background:var(--clay);color:#fff;padding:3px 10px;border-radius:20px;}
footer{border-top:1px solid var(--line);padding:22px 0 calc(22px + env(safe-area-inset-bottom,0px));font-size:.82rem;color:#555;}
</style>
</head>
<body>
<header><div class="wrap header-row">
  <div class="logo">Silk Road</div>
  <nav class="main-nav">
    <a href="index.html" data-i18n="nav_home">Home</a>
    <a href="tours.html" class="active" data-i18n="nav_tours">Tour Packages</a>
    <a href="destinations.html" data-i18n="nav_dest">Destinations</a>
    <a href="food.html" data-i18n="nav_food">Where to Eat</a>
    <a href="news.html" data-i18n="nav_news">News</a>
  </nav>
  <div class="lang-switch"><button class="active" data-lang="en" onclick="setLang('en')">EN</button><button data-lang="ru" onclick="setLang('ru')">RU</button><button data-lang="uz" onclick="setLang('uz')">UZ</button></div>
</div></header>

<div class="page-hero"><div class="wrap"><h1 data-i18n="tours_h1">Ready-made tour packages</h1></div></div>

<section>
  <div class="wrap">
  <div class="filters" id="cityFilter">
    <button class="active" data-city="all" data-i18n="p_any">Any</button>
    <button data-city="Samarkand" data-i18n="city_sam">Samarkand</button>
    <button data-city="Bukhara" data-i18n="city_buk">Bukhara</button>
    <button data-city="Khiva" data-i18n="city_khi">Khiva</button>
    <button data-city="Tashkent" data-i18n="city_tas">Tashkent</button>
  </div>
  <div class="grid" id="tourGrid"></div>
  </div>
</section>

<footer><div class="wrap" data-i18n="footer_text">Silk Road — student travel guide project.</div></footer>

<script>
const CITY_NAMES={
  Samarkand:{en:"Samarkand",ru:"Самарканд",uz:"Samarqand"},
  Bukhara:{en:"Bukhara",ru:"Бухара",uz:"Buxoro"},
  Khiva:{en:"Khiva",ru:"Хива",uz:"Xiva"},
  Tashkent:{en:"Tashkent",ru:"Ташкент",uz:"Toshkent"}
};
const TOURS=[
  {city:"Samarkand",price:"$$",
    name:{en:"5th Grade Heritage Route",ru:"Маршрут для 5-х классов",uz:"5-sinflar uchun marshrut"},
    desc:{en:"Registan → Gur-e-Amir → Siyob Bazaar lunch → Shah-i-Zinda. The school's standard route, used every year.",
          ru:"Регистан → Гур-Эмир → обед на базаре Сиаб → Шахи-Зинда. Стандартный школьный маршрут, используется каждый год.",
          uz:"Registon → Guri Amir → Siyob bozorida tushlik → Shohi Zinda. Maktabning har yili foydalanadigan standart marshruti."}},
  {city:"Samarkand",price:"$",
    name:{en:"One-Day Highlights",ru:"Однодневный тур",uz:"Bir kunlik tur"},
    desc:{en:"A condensed version for short visits: Registan and Gur-e-Amir only.",
          ru:"Сокращённая версия для короткого визита: только Регистан и Гур-Эмир.",
          uz:"Qisqa tashrif uchun qisqartirilgan versiya: faqat Registon va Guri Amir."}},
  {city:"Bukhara",price:"$",
    name:{en:"Old Town Walking Tour",ru:"Пешая экскурсия по старому городу",uz:"Eski shahar bo'ylab piyoda sayohat"},
    desc:{en:"Kalyan Minaret, Ark Fortress, trading domes — all on foot.",
          ru:"Минарет Калян, крепость Арк, торговые купола — всё пешком.",
          uz:"Kalon minorasi, Ark qal'asi, savdo gumbazlari — barchasi piyoda."}}
];
let currentLang="en";
function renderTours(city){
  const grid=document.getElementById("tourGrid");
  const list=city==="all"?TOURS:TOURS.filter(t=>t.city===city);
  grid.innerHTML=list.length?list.map(t=>`<div class="card"><h3>${t.name[currentLang]}</h3><p>${CITY_NAMES[t.city][currentLang]} · ${t.desc[currentLang]}</p><span class="price">${t.price}</span></div>`).join(""):
    `<p style="color:#555;font-style:italic">No tours added for this city yet.</p>`;
}
document.getElementById("cityFilter").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  document.querySelectorAll("#cityFilter button").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active");
  renderTours(e.target.dataset.city);
});
renderTours("all");

const I18N={
en:{nav_home:"Home",nav_tours:"Tour Packages",nav_dest:"Destinations",nav_food:"Where to Eat",nav_news:"News",
tours_h1:"Ready-made tour packages",p_any:"Any",footer_text:"Silk Road — student travel guide project.",
city_sam:"Samarkand",city_buk:"Bukhara",city_khi:"Khiva",city_tas:"Tashkent"},
ru:{nav_home:"Главная",nav_tours:"Тур пакеты",nav_dest:"Направления",nav_food:"Где поесть",nav_news:"Новости",
tours_h1:"Готовые тур-пакеты",p_any:"Любой",footer_text:"Silk Road — студенческий туристический проект.",
city_sam:"Самарканд",city_buk:"Бухара",city_khi:"Хива",city_tas:"Ташкент"},
uz:{nav_home:"Bosh sahifa",nav_tours:"Tur paketlar",nav_dest:"Yo'nalishlar",nav_food:"Qayerda ovqatlanish",nav_news:"Yangiliklar",
tours_h1:"Tayyor tur paketlar",p_any:"Har qanday",footer_text:"Silk Road — talabalar sayohat loyihasi.",
city_sam:"Samarqand",city_buk:"Buxoro",city_khi:"Xiva",city_tas:"Toshkent"}
};
function setLang(lang){
  currentLang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(I18N[lang][k])el.textContent=I18N[lang][k];});
  document.querySelectorAll('.lang-switch button').forEach(b=>{b.classList.toggle('active', b.dataset.lang===lang);});
  document.documentElement.lang=lang; localStorage.setItem('site_lang',lang);
  const activeCity=document.querySelector("#cityFilter button.active");
  renderTours(activeCity?activeCity.dataset.city:"all");
}
try{const s=localStorage.getItem('site_lang'); if(s&&I18N[s])setLang(s);}catch(e){}
</script>
</body>
</html>
