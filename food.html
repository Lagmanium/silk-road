<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silk Road — Where to Eat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--teal:#0088c2;--bright:#1aa64a;--sand:#e9f8f0;--clay:#d2262f;--cream:#fff;--line:#cfe3d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;} html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{margin:0;background:var(--cream);color:var(--ink);overflow-x:hidden;}
body{font-family:'Work Sans',sans-serif;line-height:1.5;}
h1,h2,h3{font-family:'Marcellus',serif;font-weight:400;margin:0;color:#000;}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px;padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right));}
a{text-decoration:none;color:inherit;} button,select{font-family:inherit;cursor:pointer;}
header{background:var(--teal);color:#fff;position:sticky;top:0;z-index:10;}
.header-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:12px;flex-wrap:wrap;}
.logo{font-family:'Marcellus',serif;font-size:1.25rem;color:#fff;}
nav.main-nav{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem;}
nav.main-nav a{color:#eaf6ff;}
nav.main-nav a.active{color:#c6ffdb;border-bottom:2px solid #c6ffdb;padding-bottom:3px;}
.lang-switch{display:flex;gap:4px;}
.lang-switch button{background:none;border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:4px;padding:5px 9px;font-size:.8rem;}
.lang-switch button.active{background:#fff;color:var(--teal);border-color:#fff;}
.page-hero{background:linear-gradient(160deg,#0099cc 0%,#1aa64a 130%);color:#fff;padding:40px 0;}
.page-hero h1{color:#fff;font-size:clamp(1.6rem,4vw,2.4rem);}
section{padding:40px 0;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0;}
.filters select{padding:9px;border:1px solid var(--line);border-radius:6px;font-size:.9rem;}
.filters button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font-size:.85rem;}
.filters button.active{background:#fff;color:var(--ink);border-color:var(--bright);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
.card{background:var(--sand);border-radius:6px;padding:20px;border:1px solid var(--line);}
.card h3{font-size:1.1rem;}
.card p{font-size:.88rem;color:#333;margin-top:6px;}
.card .price{display:inline-block;margin-top:10px;font-size:.78rem;background:var(--clay);color:#fff;padding:3px 10px;border-radius:20px;}
footer{border-top:1px solid var(--line);padding:22px 0 calc(22px + env(safe-area-inset-bottom,0px));font-size:.82rem;color:#555;}
</style>
</head>
<body>
<header><div class="wrap header-row">
  <div class="logo">Silk Road</div>
  <nav class="main-nav">
    <a href="index.html" data-i18n="nav_home">Home</a>
    <a href="tours.html" data-i18n="nav_tours">Tour Packages</a>
    <a href="destinations.html" data-i18n="nav_dest">Destinations</a>
    <a href="food.html" class="active" data-i18n="nav_food">Where to Eat</a>
    <a href="news.html" data-i18n="nav_news">News</a>
  </nav>
  <div class="lang-switch"><button class="active" data-lang="en" onclick="setLang('en')">EN</button><button data-lang="ru" onclick="setLang('ru')">RU</button><button data-lang="uz" onclick="setLang('uz')">UZ</button></div>
</div></header>

<div class="page-hero"><div class="wrap"><h1 data-i18n="food_h1">Where to eat</h1></div></div>

<section>
  <div class="wrap">
  <div class="filters">
    <select id="cuisineFilter"><option value="all" data-i18n="p_any">Any cuisine</option></select>
    <div id="priceFilter">
      <button class="active" data-p="all" data-i18n="p_any">Any</button>
      <button data-p="$" data-i18n="p_low">Budget</button>
      <button data-p="$$" data-i18n="p_mid">Medium</button>
      <button data-p="$$$" data-i18n="p_high">High</button>
    </div>
  </div>
  <div class="grid" id="foodGrid"></div>
  </div>
</section>

<footer><div class="wrap" data-i18n="footer_text">Silk Road — student travel guide project.</div></footer>

<script>
const PLACES=[
  {city:"Samarkand",name:"Samarkand Osh Markazi",cuisine:"Uzbek",price:"$",desc:"Classic plov, local favorite."},
  {city:"Samarkand",name:"Registon Restaurant",cuisine:"Uzbek",price:"$$$",desc:"Traditional dishes with a Registan view."},
  {city:"Samarkand",name:"Bibikhanum Teahouse",cuisine:"Café",price:"$",desc:"Tea, samsa, and pastries."},
  {city:"Bukhara",name:"Old Bukhara Restaurant",cuisine:"Uzbek",price:"$$",desc:"Courtyard dining in a merchant house."}
];
let curPrice="all", curCuisine="all";
function fill(){
  const cuisines=["all",...new Set(PLACES.map(p=>p.cuisine))];
  document.getElementById("cuisineFilter").innerHTML=cuisines.map(c=>`<option value="${c}">${c==='all'?'Any cuisine':c}</option>`).join("");
}
function render(){
  const list=PLACES.filter(p=>(curPrice==="all"||p.price===curPrice)&&(curCuisine==="all"||p.cuisine===curCuisine));
  document.getElementById("foodGrid").innerHTML=list.length?list.map(p=>`<div class="card"><h3>${p.name}</h3><p>${p.city} · ${p.cuisine} — ${p.desc}</p><span class="price">${p.price}</span></div>`).join(""):
    `<p style="color:#555;font-style:italic">No places match these filters yet.</p>`;
}
document.getElementById("priceFilter").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  document.querySelectorAll("#priceFilter button").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active"); curPrice=e.target.dataset.p; render();
});
document.getElementById("cuisineFilter").addEventListener("change",e=>{curCuisine=e.target.value; render();});
fill(); render();

const I18N={
en:{nav_home:"Home",nav_tours:"Tour Packages",nav_dest:"Destinations",nav_food:"Where to Eat",nav_news:"News",
food_h1:"Where to eat",p_any:"Any",p_low:"Budget",p_mid:"Medium",p_high:"High",
footer_text:"Silk Road — student travel guide project."},
ru:{nav_home:"Главная",nav_tours:"Тур пакеты",nav_dest:"Направления",nav_food:"Где поесть",nav_news:"Новости",
food_h1:"Где поесть",p_any:"Любой",p_low:"Бюджетно",p_mid:"Средне",p_high:"Дорого",
footer_text:"Silk Road — студенческий туристический проект."},
uz:{nav_home:"Bosh sahifa",nav_tours:"Tur paketlar",nav_dest:"Yo'nalishlar",nav_food:"Qayerda ovqatlanish",nav_news:"Yangiliklar",
food_h1:"Qayerda ovqatlanish",p_any:"Har qanday",p_low:"Arzon",p_mid:"O'rtacha",p_high:"Qimmat",
footer_text:"Silk Road — talabalar sayohat loyihasi."}
};
function setLang(lang){
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(I18N[lang][k])el.textContent=I18N[lang][k];});
  document.querySelectorAll('.lang-switch button').forEach(b=>{b.classList.toggle('active', b.dataset.lang===lang);});
  document.documentElement.lang=lang; localStorage.setItem('site_lang',lang);
}
try{const s=localStorage.getItem('site_lang'); if(s&&I18N[s])setLang(s);}catch(e){}
</script>
</body>
</html>
